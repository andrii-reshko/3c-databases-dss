<!doctype html>
<html lang="en">
{{template "head" .}}
<body>
{{template "navbar"}}

<div class="container">
    <h2>Evaluation Matrix</h2>

    <form action="/evaluations" method="post">
        <div class="table-responsive">
            <table class="table">
                <thead>
                <tr>
                    <th scope="col"></th>
                    {{ range .view.Criteria }}
                    <th scope="col" class="text-center align-top" title="Weight: {{ .Weight }} | {{ .Description }}">
                        <small class="fw-normal">{{ .Name }}</small>
                    </th>
                    {{ end }}
                </tr>
                </thead>
                <tbody>
                {{ range .view.Alternatives }}
                <tr>
                    <th class="fw-normal" scope="row">{{ .Name }}</th>
                    {{ $altID := .ID }}
                    {{ range $.view.Criteria }}
                    <td class="align-middle data-col">
                        <input type="number" step="any" class="form-control form-control-sm"
                               name="eval-{{ $altID }}-{{ .ID }}"
                               value="{{ index (index $.view.Values $altID) .ID }}"
                               style="width: 70px;"
                        >
                    </td>
                    {{ end }}
                </tr>
                {{ end }}
                </tbody>
            </table>
        </div>
        <button type="submit" class="btn btn-primary">Save</button>
        <a href="/ranking" class="btn btn-success">View Ranking</a>
    </form>
</div>
{{template "scripts"}}
</body>
</html>
