<!doctype html>
<html lang="en">
{{template "head" .}}
<body>
{{template "navbar"}}

<div class="container">
    <h2>{{ .title }}</h2>

    <form action="{{ .action }}" method="post">
        <div class="mb-3">
            <label for="name" class="form-label">Name</label>
            <input type="text" class="form-control" id="name" name="name" value="{{ .alternative.Name }}" required>
        </div>
        <div class="mb-3">
            <label for="description" class="form-label">Description</label>
            <textarea class="form-control" id="description" name="description" rows="3">{{ .alternative.Description }}</textarea>
        </div>
        <button type="submit" class="btn btn-primary">Save</button>
        <a href="/alternatives" class="btn btn-secondary">Cancel</a>
    </form>
</div>

{{template "scripts"}}
</body>
</html>
