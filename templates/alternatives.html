<!doctype html>
<html lang="en">
{{template "head" .}}
<body>
{{template "navbar"}}

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Alternatives</h2>
        <a href="/alternatives/new" class="btn btn-primary">Add New Alternative</a>
    </div>

    <table class="table table-striped">
        <thead>
        <tr>
            <th scope="col">Name</th>
            <th scope="col">Description</th>
            <th scope="col">Actions</th>
        </tr>
        </thead>
        <tbody>
        {{ range .alternatives }}
        <tr>
            <td>{{ .Name }}</td>
            <td>{{ .Description }}</td>
            <td>
                <a href="/alternatives/edit/{{ .ID }}" class="btn btn-sm btn-secondary">Edit</a>
                <a href="/alternatives/delete/{{ .ID }}" class="btn btn-sm btn-danger" onclick="return confirm('Are you sure?')">Delete</a>
            </td>
        </tr>
        {{ else }}
        <tr>
            <td colspan="3">No alternatives found.</td>
        </tr>
        {{ end }}
        </tbody>
    </table>
</div>

{{template "scripts"}}
</body>
</html>
